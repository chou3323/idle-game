function pages(p,n){const a=[];const add=i=>a.push(`<button class="pg ${i===p?'on':''}" data-pg="${i}">${i}</button>`);a.push(`<button class="pg" data-pg="${Math.max(1,p-1)}">‹</button>`);for(let i=1;i<=n;i++){if(i===1||i===n||Math.abs(i-p)<=2)add(i);else if(a[a.length-1]!=='…')a.push('…')}a.push(`<button class="pg" data-pg="${Math.min(n,p+1)}">›</button>`);return`<span class="pgs">${a.join('')}</span>`}

WINS.exchange={title:'鑽石交易所',w:440,manual:1,sub:()=>``,
 html(o){o.range=o.range||'24h';const x=o.x;const me=G.me;if(!x){return'<div class="empty">載入中…</div>'}const pts=x.pts.filter(p=>p[1]!=null);
 const chart=()=>{if(!pts.length)return'<div class="chart empty">此期間尚無成交</div>';const mn=Math.min(...pts.map(p=>p[1])),mx=Math.max(...pts.map(p=>p[1]));const W=300,H=90;const X=i=>8+i/(x.pts.length-1)*(W-16),Y=v=>H-8-(mx===mn?.5:(v-mn)/(mx-mn))*(H-20);const vmax=Math.max(1,...x.pts.map(p=>p[2]));let path='',dots='',bars='';x.pts.forEach((p,i)=>{bars+=`<rect x="${X(i)-2}" y="${H-(p[2]/vmax)*16}" width="4" height="${(p[2]/vmax)*16}" fill="#4a6ab855"/>`;if(p[1]!=null){path+=(path?'L':'M')+X(i)+' '+Y(p[1]);dots+=`<circle cx="${X(i)}" cy="${Y(p[1])}" r="2.2" fill="#ffb020"/>`}});return`<svg viewBox="0 0 ${W} ${H}" class="chart"><rect width="${W}" height="${H}" fill="#14244a"/>${bars}<path d="${path}" stroke="#ffb020" stroke-width="1.6" fill="none"/>${dots}<text x="4" y="11" fill="#cde" font-size="9">${mx.toLocaleString()}</text><text x="4" y="${H-2}" fill="#cde" font-size="9">${mn.toLocaleString()}</text></svg>`};
 const dep=(arr,cls,best)=>`<div class="dcol ${cls}"><div class="dh"><span>${cls==='bid'?'最高買價':'最低賣價'}</span><b>${best?best.toLocaleString():'—'}</b></div>${arr.map(([b,lim,n])=>`<div class="drow"><span>${b}%</span><span>${lim?(cls==='bid'?'≥ ':'≤ ')+lim.toLocaleString():'—'}</span><b>${n.toLocaleString()}</b><i style="width:${Math.min(100,n/Math.max(1,...arr.map(a=>a[2]))*100)}%"></i></div>`).join('')}</div>`;
 const panel=(side)=>{const P=o[side]=o[side]||{mode:'now',qty:0,price:side==='buy'?(x.bestAsk||''):(x.bestBid||'')};const ref=side==='buy'?x.bestAsk:x.bestBid;return`<div class="xp"><div class="xph">${side==='buy'?'用金幣 買鑽石':'賣鑽石 換金幣'}</div><small>${side==='buy'?'最低賣價':'最高收購價'} ${ART.icon('coin',12)}<b>${ref?ref.toLocaleString():'—'}</b></small><div class="seg"><span class="${P.mode==='now'?'on':''}" data-m="${side}:now">${side==='buy'?'立即購買':'立即出售'}</span><span class="${P.mode==='order'?'on':''}" data-m="${side}:order">${side==='buy'?'買單':'出售訂單'}</span></div>${P.mode==='order'?`<label>單價（金幣/顆）<input type="number" data-pr="${side}" value="${P.price}"></label>`:''}<label>鑽石數量 <input type="number" data-qt="${side}" value="${P.qty||0}" min="0"></label><button class="btn b wide" data-go="${side}">${side==='buy'?(P.mode==='now'?'立即購買':'掛買單'):(P.mode==='now'?'立即出售':'掛賣單')}</button></div>`};
 return`<div class="xtop"><small>隨處皆可買賣</small><span>${ART.icon('coin',14)} ${fmt(me.zeny)}　${ART.icon('dia',14)} ${me.dia}</span></div>
 <div class="xbox"><div class="xh">◉ 平均價格 <small>${x.avg?x.avg.toLocaleString()+' 金幣':'—'} · 成交 ${x.vol.toLocaleString()} 鑽石</small></div><div class="xchart">${chart()}<div class="rng">${['24h','7d','4w'].map(r=>`<button class="btn sm ${o.range===r?'b':''}" data-r="${r}">${{'24h':'24 小時','7d':'7 天','4w':'4 週'}[r]}</button>`).join('')}</div></div></div>
 <div class="xbox"><div class="xh">市場深度 <small>距最佳價格範圍內累計的鑽石</small></div><div class="depth">${dep(x.dBid,'bid',x.bestBid)}${dep(x.dAsk,'ask',x.bestAsk)}</div></div>
 <div class="xpanels">${panel('buy')}${panel('sell')}</div>
 <div class="xbox"><div class="xh">我的訂單 <small>買賣雙方各須支付手續費：${x.p.fee}%（依成交金幣計算，銷毀）</small></div>${x.mine.length?x.mine.map(m=>`<div class="mrow"><span class="${m.side}">${m.side==='bid'?'買':'賣'}</span><span>${m.qty} 顆 @ ${m.price.toLocaleString()}</span><small>${new Date(+m.ts).toLocaleTimeString()}</small><button class="btn sm" data-cx="${m.id}">撤單</button></div>`).join(''):'<div class="empty sm">暫無掛單</div>'}<div class="note">帳號下所有角色合併計算。每一側可掛單數：1 筆（上限 ${x.p.max} 筆）。每 ${x.p.gap} 秒可掛單或成交 1 次。撤單滿 ${x.p.cancel} 次/每小時即暫停撤單。</div></div>
 <div class="xlink" onclick="UI.win('mall')">在商城用真實貨幣儲值鑽石 ›</div>`},
 async load(o){const r=await req({op:'dxinfo',range:o.range});o.x=r.dx;UI.renderWin('exchange')},
 bind(b,o){const W=WINS.exchange;if(!o.x&&!o.ld){o.ld=1;W.load(o).then(()=>o.ld=0);clearInterval(o.iv);o.iv=setInterval(()=>{if(UI.open.exchange&&!(document.activeElement&&document.activeElement.closest('#w-exchange')))W.load(UI.open.exchange);else if(!UI.open.exchange)clearInterval(o.iv)},5000)}
  b.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{o.range=x.dataset.r;W.load(o)});b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{const [s,m]=x.dataset.m.split(':');o[s].mode=m;UI.renderWin('exchange')});
  b.querySelectorAll('[data-qt]').forEach(x=>x.oninput=()=>o[x.dataset.qt].qty=+x.value);b.querySelectorAll('[data-pr]').forEach(x=>x.oninput=()=>o[x.dataset.pr].price=+x.value);
  b.querySelectorAll('[data-go]').forEach(x=>x.onclick=async()=>{const s=x.dataset.go,P=o[s];if(!P.qty)return toast('請輸入數量',1);await act({op:'dx',side:s,mode:P.mode,qty:P.qty,price:P.price});W.load(o)});b.querySelectorAll('[data-cx]').forEach(x=>x.onclick=async()=>{await act({op:'dxcancel',oid:+x.dataset.cx});W.load(o)})}};

 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=e=>{e.stopPropagation();const w=b.dataset.w;if(w==='more'){$('#more').classList.toggle('on');return}$('#more').classList.remove('on');if(['party','guild','mail','rank','world'].includes(w))return toast(t(b.textContent.trim())+'：下一版開放');if(w==='lore')return UI.win('lore',{job:G.me.job==='nov'?'kni':G.me.job});if(w==='mlog')return UI.win('mlog',{});UI.win(w)})}

 document.querySelectorAll('#login [placeholder]').forEach(e=>e.placeholder=t(e.placeholder));
 if('ontouchstart' in window||matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
