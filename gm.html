<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨帆物語 · GM 數值表</title><meta name="robots" content="noindex">
<style>body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#0e1730;color:#eee}header{background:linear-gradient(#2e54a8,#142a5c);border-bottom:2px solid #e9c46a;padding:10px 16px;display:flex;gap:12px;align-items:center}header b{font-size:18px}main{display:grid;grid-template-columns:200px 280px 1fr;height:calc(100vh - 50px)}nav,#rows{overflow:auto;border-right:1px solid #2a3a6a}nav button,#rows div{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #1d2a50;color:#dde;padding:9px 12px;cursor:pointer;font-size:14px}nav button.on,#rows div.on{background:#24418a;color:#ffe9a0}#rows small{color:#8a9ac8;display:block;font-size:11px}#ed{padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto}textarea{flex:1;min-height:300px;background:#081024;color:#cfe;border:1px solid #2a3a6a;border-radius:6px;font:13px/1.45 ui-monospace,monospace;padding:10px}input{background:#081024;color:#fff;border:1px solid #2a3a6a;border-radius:4px;padding:6px}button.b{background:linear-gradient(#fff3b0,#e0aa28);border:1px solid #6a4a08;border-radius:5px;padding:6px 14px;font-weight:700;cursor:pointer}button.r{background:#a02020;color:#fff;border:1px solid #600;border-radius:5px;padding:6px 14px;cursor:pointer}.msg{min-height:20px;color:#9fe870}.msg.e{color:#ff8080}#login{max-width:340px;margin:12vh auto;background:#14244a;border:2px solid #e9c46a;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px}.prm{display:grid;grid-template-columns:1fr 120px 70px;gap:6px;align-items:center;margin-bottom:4px}table{border-collapse:collapse;font-size:12px}td{border-bottom:1px solid #1d2a50;padding:4px 6px}</style></head><body>
<header><b>⚙ 晨帆物語 GM 數值表</b><small id="hash"></small><span style="flex:1"></span><button class="b" id="logbtn">修改紀錄</button><button class="r" id="out">登出</button></header>
<div id="login"><b>GM 登入</b><input id="u" placeholder="GM 帳號"><input id="p" type="password" placeholder="GM 密碼"><button class="b" id="go">登入</button><div class="msg e" id="le"></div><small style="color:#8a9ac8">使用伺服器的 GM 帳號。所有修改即時套用並廣播給線上玩家，以補丁形式保存，可逐筆還原。</small></div>
<main id="app" style="display:none"><nav id="nav"></nav><div id="rows"></div><div id="ed"></div></main>
<script>
const API=location.hostname==='localhost'?'':'https://api.ragnarokidle.app';let TK=sessionStorage.gmtk||'',T=null,cur='items',sel=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(API+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+TK},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.gmtk='';location.reload()}return j}
$('#go').onclick=async()=>{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const j=await r.json();if(!j.token){$('#le').textContent=j.error||'登入失敗';return}TK=sessionStorage.gmtk=j.token;localStorage.robGMok='1';boot()};
$('#out').onclick=()=>{sessionStorage.gmtk='';location.reload()};
async function boot(){const j=await api('/api/rob/gm/tables');if(!j.tables)return;T=j.tables;$('#hash').textContent='內容雜湊 '+j.hash;$('#login').style.display='none';$('#app').style.display='';nav()}
const N={params:'全域參數',jobs:'職業',weapons:'武器類型',skills:'技能',buffs:'增益',items:'物品',mobs:'怪物',quests:'任務',refine:'精煉',sets:'套裝',cats:'分類',exchange:'物品兌換',auction:'拍賣池'};
function nav(){$('#nav').innerHTML=Object.keys(T).map(k=>`<button class="${k===cur?'on':''}" data-k="${k}">${N[k]||k} <small style="color:#8a9ac8">${Array.isArray(T[k])?T[k].length:Object.keys(T[k]).length}</small></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;sel=null;nav()});rows();ed()}
function rows(){const t=T[cur];if(cur==='params'){$('#rows').innerHTML='<div class="on">全部參數</div>';return}const ks=Array.isArray(t)?t:Object.keys(t);$('#rows').innerHTML=`<div data-new="1" style="color:#ffe9a0">＋ 新增一列</div>`+ks.map(k=>{const r=Array.isArray(t)?{}:t[k];return`<div class="${k===sel?'on':''}" data-k="${esc(k)}">${esc(k)}<small>${esc(r.n||'')}${r.lv?' · Lv'+r.lv:''}${r.hp?' · HP'+r.hp:''}${r.type?' · '+r.type:''}</small></div>`}).join('');$('#rows').querySelectorAll('[data-k]').forEach(d=>d.onclick=()=>{sel=d.dataset.k;rows();ed()});$('#rows').querySelector('[data-new]').onclick=()=>{sel='';ed()}}
function ed(){const e=$('#ed');const t=T[cur];
 if(cur==='params'){e.innerHTML=`<b>全域參數</b>${Object.entries(t).map(([k,v])=>`<div class="prm"><span>${esc(k)}</span><input value="${v}" data-p="${esc(k)}"><button class="b" data-ps="${esc(k)}">儲存</button></div>`).join('')}<div class="msg" id="m"></div>`;e.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>save('params',b.dataset.ps,+e.querySelector(`[data-p="${b.dataset.ps}"]`).value));return}
 if(sel===null){e.innerHTML='<p style="color:#8a9ac8">選擇左側一列編輯，或新增。</p>';return}const arr=Array.isArray(t);
 e.innerHTML=`<div style="display:flex;gap:8px;align-items:center"><b>${N[cur]}</b><input id="key" value="${esc(sel)}" placeholder="ID（英數）" ${sel?'readonly':''}></div>${arr?'':`<textarea id="js" spellcheck="false">${esc(sel?JSON.stringify(t[sel],null,2):'{\n  "n": ""\n}')}</textarea>`}<div style="display:flex;gap:8px"><button class="b" id="sv">${arr?'加入':'儲存並即時套用'}</button>${sel?'<button class="r" id="del">刪除</button>':''}</div><div class="msg" id="m"></div>`;
 $('#sv').onclick=()=>{const key=$('#key').value.trim();if(arr)return save(cur,key,key);let row;try{row=JSON.parse($('#js').value)}catch(x){return msg('JSON 格式錯誤：'+x.message,1)}save(cur,key,row)};const d=$('#del');if(d)d.onclick=()=>{if(confirm('確定刪除 '+sel+'？'))save(cur,sel,null)}}
function msg(t,e){const m=$('#m');if(m){m.textContent=t;m.className='msg'+(e?' e':'')}}
async function save(tbl,key,row){const j=await api('/api/rob/gm/set',{tbl,key,row});if(j.e)return msg(j.e,1);const r=await api('/api/rob/gm/tables');T=r.tables;$('#hash').textContent='內容雜湊 '+r.hash;if(row===null)sel=null;else sel=tbl==='params'?sel:key;nav();msg('✔ 已套用並廣播（'+r.hash+'）')}
$('#logbtn').onclick=async()=>{const j=await api('/api/rob/gm/log');$('#ed').innerHTML=`<b>修改紀錄（最新 100 筆）</b><table>${(j.log||[]).map(l=>`<tr><td>#${l.id}</td><td>${new Date(+l.ts).toLocaleString()}</td><td>${esc(N[l.tbl]||l.tbl)}</td><td>${esc(l.key)}</td><td>${l.row===null||l.row==='null'?'刪除':'修改'}</td><td><button class="r" data-rv="${l.id}">還原</button></td></tr>`).join('')}</table><div class="msg" id="m"></div>`;$('#ed').querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{const r=await api('/api/rob/gm/revert',{id:+b.dataset.rv});msg('已還原，剩 '+r.patches+' 筆補丁');boot()})};
if(TK)boot();
</script></body></html>
