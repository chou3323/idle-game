 return `<div class="pvh">${remove?'退點後':'點亮後'}預覽</div>${rows||'<div class="dim">目前裝備與技能下沒有直接數值變化（例如加成的技能類型你還沒用）。</div>'}`}
function bTxt(b){const N={str:'力量',dex:'敏捷',int:'智力',lifePct:'% 最大生命',incPhys:'% 物理傷害',incEle:'% 元素傷害',incSpell:'% 法術傷害',aps:'% 攻擊速度',cast:'% 施法速度',incCrit:'% 暴擊率',critM:'% 暴擊傷害',incDot:'% 持續傷害',incMin:'% 召喚物傷害',armorPct:'% 護甲',evaPct:'% 閃避',esPct:'% 能量護盾',resAll:'% 全抗',auraEff:'% 光環效果',incAoe:'% 範圍傷害',incProj:'% 投射物傷害',ign:'% 點燃機率',frz:'% 冰凍機率',chain:' 連鎖',poison:'% 中毒機率',manaPct:'% 魔力',manaRegen:'% 魔力回復',regen:'% 每秒生命回復',mn:' 召喚物數量',tgt:' 目標數',proj:' 投射物',block:'% 格擋',leech:'% 吸血',more:'% 更多傷害',incDmg:'% 傷害',auraSlot:' 光環欄位',rage:' 狂怒',pierce:' 穿透',incDmgParty:'% 隊伍傷害',curseEff:'% 詛咒效果'};return Object.entries(b||{}).map(([k,v])=>N[k]?`+${v}${N[k]}`:k+' '+v).join('、')}
// 通貨
function rCur(m){const S=G.S;const all=[...SLOTS.map(sl=>H().eq[sl]).filter(Boolean),...S.inv];const sel=G.sel&&findItemC(G.sel.u);
 m.innerHTML=`<div class="card"><b>通貨</b> <span class="dim">先選通貨，再選裝備，按「使用」。</span><div class="curgrid">${Object.entries(CUR).map(([k,c])=>`<div class="curc ${G.selCur===k?'sel':''} ${(S.cur[k]||0)?'':'zero'}" data-k="${k}">${ART.img(ART.cur(k),'ci')}<b>${S.cur[k]||0}</b><small>${c.n}</small></div>`).join('')}</div>
 ${G.selCur?`<div class="curdesc"><b>${CUR[G.selCur].n}</b>：${CUR[G.selCur].d}</div>`:''}</div>
 <div class="card"><b>目標裝備</b><div class="inv">${all.map(it=>`<div class="ii" data-u="${it.u}">${itemIcon(it,G.sel&&G.sel.u===it.u?'sel':'')}</div>`).join('')}</div>
 ${sel?`<div class="idet">${itemIcon(sel.it,'big')}<div class="itx">${itemCard(sel.it)}${sockHTML(sel.it)}</div></div>`:''}
 <div class="row"><button class="btn gold" id="use" ${G.selCur&&(sel||G.selCur==='c_cut'||G.selCur==='c_glass')?'':'disabled'}>使用 ${G.selCur?CUR[G.selCur].n:''}</button><button class="btn" id="use10" ${G.selCur&&sel?'':'disabled'}>連續使用直到…</button></div></div>`;
 m.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{G.selCur=e.dataset.k;rCur(m)});m.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>{G.sel={u:+e.dataset.u};rCur(m)});
 $('#use').onclick=async()=>{if(G.selCur==='c_cut'||G.selCur==='c_glass'){const i=G.gsel;if(i==null)return toast('請先到「裝備」選一顆寶石');await act('cur',{k:G.selCur,g:i});return}const before=JSON.stringify(sel.it.mods);const r=await act('cur',{k:G.selCur,u:sel.it.u});if(!r.e){FX.flash=.3;SND.drop(sel.it.rar||1,'cur')}setTimeout(()=>{if(G.tab==='cur')rCur($('#main'))},150)};
 $('#use10').onclick=async()=>{const want=prompt('連續使用直到出現含有此文字的詞條（例如：生命、暴擊、連結數 5）：');if(!want)return;for(let i=0;i<50;i++){const r=await act('cur',{k:G.selCur,u:sel.it.u});if(r.e)break;await new Promise(r=>setTimeout(r,120));const it=findItemC(sel.it.u).it;const txt=it.mods.map(modTxt).join(' ')+' 連結數 '+maxLink(it)+' 孔數 '+(it.so||[]).length;if(txt.includes(want)){toast('達成！',1);break}}rCur($('#main'))}}
// 交易所
async function rMarket(m){m.innerHTML='<div class="card">載入中…</div>';let d;try{d=await http('GET','/api/market')}catch(e){m.innerHTML='<div class="card">'+esc(e.message)+'</div>';return}G.mk=d;const S=G.S;const nm=k=>k==='dia'?'鑽石':k==='gold'?'金幣':CUR[k]?CUR[k].n:k;
 m.innerHTML=`<div class="card"><b>交易所</b><div class="dim">賣家自訂收取的通貨與數量（可收鑽石）。上架費 ${d.fee.listLo}~${d.fee.listHi} 鑽；成交費＝成交價值 ${d.fee.salePct}%（依鑽石參考價換算，最低 ${d.fee.saleMin} 鑽，上架時預扣，下架退還，成交後銷毀）。</div></div>
 <div class="card"><b>掛單</b><div class="mlist">${d.list.map(l=>{const it=l.item;const what=l.kind==='cur'?`${ART.img(ART.cur(it.k),'tic')} ${CUR[it.k].n} ×${l.qty}`:l.kind==='gem'?`${ART.img(ART.gem((GEMS[it.k]||SUPS[it.k]).c,GEMS[it.k]?'a':(SUPS[it.k]||{}).trig?'t':'s',it.k),'tic')} ${(GEMS[it.k]||SUPS[it.k]).n} Lv${it.lv}`:`<span style="color:${RAR[it.rar].c}">${esc(iname(it))}</span> <span class="dim">iLv${it.ilvl} ${maxLink(it)}L</span>`;
  return`<div class="ml"><span class="mw" data-view="${l.id}">${what}</span><span class="dim">${esc(l.seller_name||'')}</span><span class="pr">${l.ask_k!=='dia'&&l.ask_k!=='gold'?ART.img(ART.cur(l.ask_k),'tic'):''}${fmt(l.ask_n)} ${nm(l.ask_k)}</span>${l.seller===G.S.heroes[0].id?`<button class="mini" data-cancel="${l.id}">下架</button>`:`<button class="mini gold" data-buy="${l.id}">購買</button>`}</div>`}).join('')||'<div class="dim">目前沒有掛單</div>'}</div></div>
 <div class="card"><b>上架</b><div class="row"><select id="lt"><option value="cur">通貨</option><option value="item">裝備（背包）</option><option value="gem">寶石</option></select><select id="lw"></select><input id="lq" type="number" value="1" min="1" style="width:70px"></div>
 <div class="row">收取 <select id="ak"><option value="dia">鑽石</option><option value="gold">金幣</option>${Object.entries(CUR).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('')}</select><input id="an" type="number" value="10" min="1" style="width:90px"><span id="fee" class="dim"></span><button class="btn gold" id="lst">上架</button></div></div>
 <div class="card"><b>鑽石參考價與商城</b><div class="dim">參考價每日依成交自動調整（有漲跌上限）；商城價格永遠高於市價，給急用。</div><div class="reft">${Object.entries(CUR).map(([k,c])=>`<div class="rf">${ART.img(ART.cur(k),'tic')}<span>${c.n}</span><span class="dim">參考 ${d.ref[k]}</span><button class="mini" data-shop="${k}">◆${d.shop[k]} 買</button></div>`).join('')}</div></div>`;
 const fill=()=>{const t=$('#lt').value;$('#lw').innerHTML=t==='cur'?Object.entries(CUR).filter(([k])=>S.cur[k]>0).map(([k,c])=>`<option value="${k}">${c.n}（${S.cur[k]}）</option>`).join(''):t==='gem'?S.gems.map((g,i)=>`<option value="${i}">${(GEMS[g.k]||SUPS[g.k]).n} Lv${g.lv}</option>`).join(''):S.inv.map(it=>`<option value="${it.u}">${esc(iname(it))} iLv${it.ilvl}</option>`).join('');$('#lq').style.display=t==='cur'?'':'none';fee()};
 const fee=()=>{const k=$('#ak').value,n=+$('#an').value||0;const v=n*(k==='dia'?1:k==='gold'?.001:d.ref[k]||0);const lf=v>=d.fee.listHiAt?d.fee.listHi:d.fee.listLo;const sf=Math.max(d.fee.saleMin,Math.ceil(v*d.fee.salePct/100));$('#fee').textContent=`價值≈${v.toFixed(1)}鑽 · 上架費 ${lf} + 成交費預扣 ${sf} 鑽`};
 $('#lt').onchange=fill;$('#ak').onchange=fee;$('#an').oninput=fee;fill();
 $('#lst').onclick=async()=>{const t=$('#lt').value,w=$('#lw').value;if(w==='')return toast('沒有可上架的');const b={ask_k:$('#ak').value,ask_n:+$('#an').value};if(t==='cur'){b.k=w;b.qty=+$('#lq').value}else if(t==='gem')b.gem=+w;else b.u=+w;try{const r=await http('POST','/api/market/list',b);toast(`已上架（上架費 ${r.listFee}、預扣 ${r.feeHold} 鑽）`);rMarket(m)}catch(e){toast(e.message,0,1)}};
 m.querySelectorAll('[data-buy]').forEach(b=>b.onclick=async()=>{try{await http('POST','/api/market/buy',{id:+b.dataset.buy});toast('購買成功',1);rMarket(m)}catch(e){toast(e.message,0,1)}});
 m.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{try{await http('POST','/api/market/cancel',{id:+b.dataset.cancel});toast('已下架，預扣成交費已退還');rMarket(m)}catch(e){toast(e.message,0,1)}});
 m.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const l=d.list.find(x=>x.id==b.dataset.view);if(l.kind==='item'){const w=document.createElement('div');w.className='modal';w.innerHTML=`<div class="card">${itemCard(l.item)}${sockHTML(l.item)}<button class="btn">關閉</button></div>`;w.onclick=()=>w.remove();document.body.appendChild(w)}});
 m.querySelectorAll('[data-shop]').forEach(b=>b.onclick=async()=>{const k=b.dataset.shop;const n=+prompt(`購買 ${CUR[k].n} 數量（每個 ${d.shop[k]} 鑽）`,'1');if(!n)return;try{const r=await http('POST','/api/shop/buy',{k,n});toast(`購買成功，花費 ${r.price} 鑽`)}catch(e){toast(e.message,0,1)}})}
// 天梯
async function rLadder(m){const cls=G.lcls||'';m.innerHTML=`<div class="card"><div class="row sb"><b>深淵試煉天梯</b><select id="lc"><option value="">全部職業</option>${Object.entries(CLS).map(([k,c])=>`<option value="${k}" ${k===cls?'selected':''}>${c.n}</option>`).join('')}</select></div><div id="lb">載入中…</div></div>`;$('#lc').onchange=e=>{G.lcls=e.target.value;rLadder(m)};
 const d=await http('GET','/api/ladder'+(cls?'?cls='+cls:''));$('#lb').innerHTML=`<div class="dim">第 ${d.season} 賽季 · 只限 2 人以上隊伍，依層數與秒數排名</div><table class="lt"><tr><th>#</th><th>隊伍成員</th><th>層數</th><th>秒</th><th>人數</th></tr>${d.list.map((r,i)=>`<tr class="${i<3?'top':''}"><td>${i+1}</td><td>${r.members.map(x=>`${esc(x.name)}<small class="dim">（${CLS[x.cls]?CLS[x.cls].n:''}${x.asc&&CLS[x.cls]&&CLS[x.cls].asc[x.asc]?'·'+CLS[x.cls].asc[x.asc].n:''} Lv${x.lv}）</small>`).join('<br>')}</td><td class="gold">${r.depth}</td><td>${r.sec}</td><td>${r.size}</td></tr>`).join('')}</table>${d.list.length?'':'<div class="dim">還沒有隊伍紀錄，快找人組隊挑戰！</div>'}`}
// 隊伍＋聊天
function rSocial(m){const p=G.party;m.innerHTML=`<div class="card"><b>隊伍（最多 10 人，人越多怪越強、經驗加成）</b>${p?`<div>${p.members.map(x=>`<div class="pm">${x.id===p.leader?'👑':''} <b>${esc(x.name)}</b> <span class="dim">${CLS[x.cls]?CLS[x.cls].n:''} Lv${x.lv}</span>${p.leader===H().id&&x.id!==p.leader?`<button class="mini" data-kick="${x.id}">移出</button>`:''}</div>`).join('')}</div><div class="dim">隊伍編號 ${p.id}，其他人輸入你的角色名即可加入。</div><button class="btn" id="pl">離開隊伍</button>`:
 `<div class="row"><button class="btn gold" id="pc">建立隊伍</button><input id="pn" placeholder="輸入隊長角色名"><button class="btn" id="pj">加入</button></div>`}</div>
 <div class="card"><b>聊天</b><div class="row"><select id="cch"><option value="world">世界</option>${p?'<option value="party">隊伍</option>':''}</select></div><div id="chat" class="chat"></div><div class="row"><input id="ct" maxlength="120" placeholder="說點什麼…" style="flex:1"><button class="btn" id="cs">送出</button></div></div>`;
 if(p){$('#pl').onclick=()=>act('party',{do:'leave'});m.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>act('party',{do:'kick',aid:+b.dataset.kick}))}else{$('#pc').onclick=()=>act('party',{do:'create'});$('#pj').onclick=()=>act('party',{do:'join',name:$('#pn').value.trim()})}
 const sendC=()=>{const t=$('#ct').value.trim();if(!t)return;G.ws.send(JSON.stringify({t:'chat',ch:$('#cch').value,text:t}));$('#ct').value=''};$('#cs').onclick=sendC;$('#ct').onkeydown=e=>{if(e.key==='Enter')sendC()};renderChat()}
function renderChat(){const c=$('#chat');if(!c)return;c.innerHTML=G.chat.map(x=>`<div><span class="dim">${x.ch.startsWith('party')?'[隊]':'[世]'}</span> <b>${esc(x.name)}</b>：${esc(x.text)}</div>`).join('');c.scrollTop=c.scrollHeight}
// 更多：寶石商人、設定
function rMore(m){const S=G.S;m.innerHTML=`<div class="card"><b>寶石商人（金幣）</b><div class="dim">價格依稀有度：普通 800、稀有 6000、極稀有 30000 金。越強的寶石越稀有，也有更高的等級與屬性需求。</div><div class="inv">${[...Object.entries(GEMS),...Object.entries(SUPS)].map(([k,d])=>`<div class="gemc" data-bg="${k}" title="${esc(d.d||'')}">${ART.img(ART.gem(d.c,GEMS[k]?'a':d.trig?'t':'s',k),'gi lg')}<small>${d.n}</small><small class="rt t${gemTier(k)}">${[0,800,6000,30000][gemTier(k)]}</small></div>`).join('')}</div><div id="bgd" class="dim"></div></div>
 <div class="card"><b>設定</b><div class="row"><label><input type="checkbox" id="snd" ${localStorage.d2snd!=='0'?'checked':''}> 音效</label><input type="range" id="vol" min="0" max="1" step=".1" value="${localStorage.d2vol||.5}"></div><div class="row"><button class="btn" id="lo">登出</button></div><div class="dim">深淵之境 v2.1.1 · 所有戰鬥與掉落由伺服器計算。</div></div>`;
 m.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{const k=b.dataset.bg,d=GEMS[k]||SUPS[k];$('#bgd').innerHTML=`<b>${d.n}</b>：${esc(d.d||'')} <button class="mini gold" id="bgb">購買</button>`;$('#bgb').onclick=()=>act('buyGem',{k})});
 const sv=()=>{localStorage.d2snd=$('#snd').checked?'1':'0';localStorage.d2vol=$('#vol').value;SND.set(+$('#vol').value,$('#snd').checked)};$('#snd').onchange=sv;$('#vol').onchange=sv;$('#lo').onclick=logout}
SND.set(+(localStorage.d2vol||.5),localStorage.d2snd!=='0');
window.addEventListener('load',()=>{if(G.tk)http('GET','/api/me').then(r=>{if(r.needChar)showChar();else start()}).catch(()=>showLogin());else showLogin();requestAnimationFrame(loop)});

</script></body></html>
