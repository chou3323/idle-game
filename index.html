 w.onclose=ev=>{if(ON.ws!==w)return;ON.ws=null;if(!ON.token)return;if(ev.code===4002){toast('帳號已在其他裝置登入');netState(0)}else netState(0);const t=Math.min(15000,1000*2**ON.retry++);setTimeout(onConnect,t)}}

 else if(t==='proster'){ON.ros=m;return}
 else if(t==='saved'){onDownload();return}
 else if(t==='presence'){if(ON.soc)for(const f of ON.soc.friends)if(f.id===m.id)f.on=m.on}
 else if(t==='friend'){toast(m.kind==='req'?`👋 ${esc(m.name)} 想加你好友`:`🎉 你和 ${esc(m.name)} 成為好友`,2500);onSocial()}

 else if(t==='sold'){toast('💰 '+esc(m.msg),3000);onLists()}
