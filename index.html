let refOpt={hi:false,ab:false,pr:false};const qty=id=>(S.inv.find(i=>i.id===id)||{q:0}).q;
function panelRef(){const eqs=S.inv.filter(i=>ITEMS[i.id].t==='eq');const ore=qty('ore');
 P(`<h3>🔨 精煉 <span class="small">💎礦石 ${ore}　💠高級 ${qty('hiore')}　🛡️防爆 ${qty('antibreak')}　🔰保護 ${qty('protect')}</span></h3>
 <p class="small">每 +1 基礎 ATK/DEF +10%。+5 起可能失敗：+5、+6 失敗 -1；挑戰 +7 以上失敗會<b>損壞消失</b>（防爆券改為 -1，保護券完全不掉）。</p>
 <div class="row small"><label><input type="checkbox" ${refOpt.hi?'checked':''} onchange="refOpt.hi=this.checked;panel()"> 用高級鋼石(+20%)</label><label><input type="checkbox" ${refOpt.ab?'checked':''} onchange="refOpt.ab=this.checked;panel()"> 用防爆券</label><label><input type="checkbox" ${refOpt.pr?'checked':''} onchange="refOpt.pr=this.checked;panel()"> 用保護券</label></div>`+(eqs.map(it=>{const r=it.ref||0;if(r>=10)return itemLine(it,'<span class="small">已滿</span>');const c=refCost(r);const rate=Math.min(1,REF_RATE[r]+(refOpt.hi&&qty('hiore')?.2:0));return itemLine(it,`<div class="small" style="text-align:right">成功率 ${Math.round(rate*100)}%${r>=6?'<br><span class="r1">⚠️失敗會損壞</span>':''}<br>💰${fmt(c.gold)} 💎${c.ore}<br><button ${S.gold<c.gold||ore<c.ore?'disabled':''} onclick="refine(${S.inv.indexOf(it)})">精煉</button></div>`)}).join('')||'<p class="small">沒有裝備</p>'))}
function useQ(id){const o=S.inv.find(x=>x.id===id);if(!o)return false;o.q--;if(!o.q)S.inv.splice(S.inv.indexOf(o),1);return true}
function refine(i,opt){if(opt)refOpt=Object.assign({hi:false,ab:false,pr:false},opt);const it=S.inv[i];if(!it||ITEMS[it.id].t!=='eq')return null;const r=it.ref||0,c=refCost(r);if(r>=10||S.gold<c.gold||qty('ore')<c.ore)return null;
 S.gold-=c.gold;for(let k=0;k<c.ore;k++)useQ('ore');let rate=REF_RATE[r];if(refOpt.hi&&useQ('hiore'))rate+=.2;
 const pr=refOpt.pr&&r>=4&&useQ('protect'),ab=!pr&&refOpt.ab&&r>=6&&useQ('antibreak');let res;
 if(Math.random()<rate){it.ref=r+1;res='ok';log(`🔨✨ 精煉成功！${ITEMS[it.id].n} +${it.ref}`,'r4')}
 else if(pr){res='protect';log(`🔨🔰 精煉失敗，保護券生效，維持 +${r}`,'r2')}
 else if(r>=6&&!ab){res='break';for(const s in S.eq)if(S.eq[s]===it.uid)S.eq[s]=null;S.inv.splice(i,1);log(`🔨💥 精煉失敗… ${ITEMS[it.id].n} 損壞了！`,'r1')}
 else{it.ref=Math.max(0,r-1);res='down';log(`🔨💔 精煉失敗… ${ITEMS[it.id].n} 降為 +${it.ref}${ab?'（防爆券生效）':''}`,'r1')}
 save();render();panel();return res}
let gmMsg='';
function panelGM(){if(!S.gm){P('<p class="small">未開啟</p>');return}
 const opt=(o,f)=>Object.entries(o).map(([k,v])=>`<option value="${k}">${f(v,k)}</option>`).join('');
 P(`<h3>🛠️ GM 面板</h3><div class="small r4">${gmMsg}</div>
 <div class="job"><b>資源</b><div class="row"><input id="gmN" type="number" value="1000" style="width:90px"><button onclick="gm('dia')">+鑽石</button><button onclick="gm('gold')">+金幣</button><button onclick="gm('month')">開月卡30天</button></div>
 <div class="row" style="margin-top:4px"><select id="gmItem">${opt(ITEMS,(v)=>v.n)}</select><button onclick="gm('item')">給道具×N</button></div>
 <div class="row" style="margin-top:4px"><select id="gmCard">${opt(CARDS,(v)=>v[0])}</select><button onclick="gm('card')">給卡片×N</button></div></div>
 <div class="job"><b>角色</b><div class="row"><span>Base</span><input id="gmB" type="number" value="${S.lv}" style="width:60px"><span>Job</span><input id="gmJ" type="number" value="${S.jlv}" style="width:60px"><button onclick="gm('lv')">設定等級</button></div>
 <div class="row" style="margin-top:4px"><select id="gmJob">${opt(JOBS,(v,k)=>v.n+'／'+(v.tn||'高階'+v.n))}</select><label class="small"><input id="gmTr" type="checkbox" ${S.trans?'checked':''}>轉生</label><select id="gmSex"><option value="M" ${S.sex==='M'?'selected':''}>男</option><option value="F" ${S.sex==='F'?'selected':''}>女</option></select><button onclick="gm('job')">設定職業</button></div>
 <div class="row" style="margin-top:4px"><button onclick="gm('skp')">+10 技能點</button><button onclick="gm('pts')">+50 屬性點</button></div></div>
 <div class="job"><b>世界</b><div class="row"><select id="gmMap">${MAPS.map((m,i)=>`<option value="${i}">${m.n}</option>`).join('')}</select><button onclick="gm('tp')">傳送（並解鎖）</button><button onclick="gm('mvp')">召喚 MVP</button></div>
 <div class="row" style="margin-top:4px"><span>經驗×</span><input id="gmRE" type="number" step="0.5" value="${S.rate.exp}" style="width:60px"><span>掉落×</span><input id="gmRD" type="number" step="0.5" value="${S.rate.drop}" style="width:60px"><button onclick="gm('rate')">套用倍率</button></div></div>
 <button class="g" onclick="S.gm=false;delete TABS.gm;goTab('set')">關閉 GM 模式</button>`)}
function gm(a,arg){const N=arg!==undefined?arg:Math.max(0,+(($('gmN')||{}).value||0));
 if(a==='dia')S.dia+=N;else if(a==='gold')S.gold+=N;else if(a==='month'){const b=monthOn()?S.month.until:Date.now();S.month={until:b+30*86400000,claimed:''}}
 else if(a==='item'){const id=typeof arg==='object'?arg.id:$('gmItem').value;addItem(id,typeof arg==='object'?arg.n:Math.max(1,N))}
 else if(a==='card'){const id=typeof arg==='object'?arg.id:$('gmCard').value;S.cards[id]=(S.cards[id]||0)+(typeof arg==='object'?arg.n:Math.max(1,N));S.seen[id]=1}
 else if(a==='lv'){const o=typeof arg==='object'?arg:{b:+$('gmB').value,j:+$('gmJ').value};S.lv=clamp(o.b|0,1,99);S.exp=0;S.jlv=clamp(o.j|0,1,jobMax());S.jexp=0}
 else if(a==='job'){const o=typeof arg==='object'?arg:{job:$('gmJob').value,tr:$('gmTr').checked,sex:$('gmSex').value};S.job=o.job;S.trans=!!o.tr;S.sex=o.sex||S.sex;S.jlv=Math.min(S.jlv,jobMax());lastJob=''}
 else if(a==='skp')S.skp+=10;else if(a==='pts')S.pts+=50;
 else if(a==='tp'){const i=arg!==undefined?arg:+$('gmMap').value;S.unlocked=Math.max(S.unlocked,i+1);goMap(i)}
 else if(a==='mvp')callBoss(true);
 else if(a==='rate'){const o=typeof arg==='object'?arg:{exp:+$('gmRE').value,drop:+$('gmRD').value};S.rate={exp:Math.max(0,o.exp||1),drop:Math.max(0,o.drop||1)}}
 gmMsg=`✔ ${a} 完成 ${new Date().toTimeString().slice(0,8)}`;log(`🛠️ GM：${a}`);save();render();panel()}
function gmLogin(p){if((p!==undefined?p:$('gmPw').value)===GM_PASS){S.gm=true;TABS.gm='🛠️GM';goTab('gm');save();return true}log('❌ GM 密碼錯誤');return false}
function panelShop(){P(`<h3>🏪 商店 <span class="small">💰 ${fmt(S.gold)}</span></h3>`+SHOP.map(k=>{const d=ITEMS[k];return `<div class="it"><span class="ic">${d.ic}</span><div class="sp"><b>${d.n}${d.slots?`[${d.slots}]`:''}</b><div class="small">${d.t==='eq'?eqDesc({id:k,ref:0,cards:[]}):d.desc}</div></div><span class="small">💰${fmt(d.price)}</span> <button ${S.gold<d.price?'disabled':''} onclick="buy('${k}',1)">買</button>${d.t!=='eq'?` <button class="alt" ${S.gold<d.price*10?'disabled':''} onclick="buy('${k}',10)">×10</button>`:''}</div>`}).join(''))}
function buy(k,n){const d=ITEMS[k];if(S.gold<d.price*n)return;S.gold-=d.price*n;if(d.t==='eq')for(let i=0;i<n;i++)addItem(k);else addItem(k,n);log(`購買 ${d.n}×${n}`);render();panel()}
function panelMap(){P(`<h3>🗺️ 世界地圖</h3>`+MAPS.map((m,i)=>`<div class="map ${i>=S.unlocked?'lock':''}"><span style="font-size:30px">${i<S.unlocked?m.ic:'🔒'}</span><div class="sp"><b>${m.n}</b> <span class="small">Lv.${m.mobs[0][2]}~${m.boss[2]}</span>
 <div class="small">${m.mobs.map(x=>`${x[1].startsWith('svg')?'🩷':x[1]}${x[0]}${etag(x[8])}${x[9]}/${SIZES[x[10]][0]}`).join('　')}</div><div class="small">MVP：${m.boss[1].startsWith('svg')?'👑':m.boss[1]}${m.boss[0]} ${etag(m.boss[8])}（擊敗 ${S.bossKills[i]}）</div></div>
 ${i<S.unlocked?`<button ${i===S.map?'disabled':''} onclick="goMap(${i})">${i===S.map?'所在地':'前往'}</button>`:'<span class="small">擊敗前區 MVP</span>'}</div>`).join(''))}
function goMap(i){if(i>=S.unlocked)return;S.map=i;mob=null;RT.cast=null;hideCast();$('mo').innerHTML='';RT.spawnT=.5;log(`🗺️ 移動到 ${MAPS[i].n}`);save();render();panel()}
function panelSet(){P(`<h3>⚙️ 設定</h3><div class="row"><span>角色名稱：<b>${S.name}</b></span><span class="small">（改名請用商城「改名卡」）</span></div>
 <div class="row" style="margin-top:6px"><span>性別：${S.sex==='M'?'♂ 男':'♀ 女'}</span><span class="small">（變性卡可切換）</span></div>
 <div class="row" style="margin-top:10px"><button class="alt" onclick="save();log('💾 已存檔')">💾 立即存檔</button><button style="background:var(--bad)" onclick="if(confirm('確定刪除存檔重新開始？'))reset()">🗑️ 重置存檔</button></div>
 <div class="row" style="margin-top:10px"><span class="small">GM</span><input id="gmPw" type="password" placeholder="GM 密碼" style="flex:1;padding:6px;border-radius:8px;border:1px solid #ddd"><button class="g" onclick="gmLogin()">開啟</button></div>
 <p class="small">每 10 隻怪／15 秒／關閉頁面自動存檔。離線收益最多 8 小時，效率約線上 10%，Base/Job 經驗各最多 1.5 級。<br>本作為原創致敬作品，名稱與美術皆為自製。</p>`)}
function reset(){localStorage.removeItem(KEY);S=fresh();mob=null;LOG=[];lastJob='';lastParty=null;$('mo').innerHTML='';log('已重置，歡迎新的冒險者！');save();render();panel()}
function modal(h){$('mbody').innerHTML=h+'<div style="text-align:center;margin-top:10px"><button onclick="$(\'modal\').style.display=\'none\'">太棒了！</button></div>';$('modal').style.display='flex'}

document.addEventListener('click',e=>{const b=e.target.closest('#nav button,#subnav button');if(!b)return;if(b.dataset.g)goGrp(b.dataset.g);else goTab(b.dataset.t)});
$('panel').addEventListener('pointerdown',()=>pDown=performance.now());addEventListener('pointerup',()=>setTimeout(()=>pDown=0,50));addEventListener('pointercancel',()=>pDown=0);document.addEventListener('click',()=>pDown=0,true);
load();if(S.gm)TABS.gm='🛠️GM';nav();render();panel();
const off=offline();let msg='';
if(migratedV2)msg+=`<h3>🎊 已更新到 v3</h3><p class="small">裝備、卡片、進度全部保留。新增 Job 等級（依原進度換算為 Job ${S.jlv}）、技能點 ${S.skp}、商人系、二轉分支、轉生、點數商城（贈送 💎100）。</p>`;

if(off){const h=Math.floor(off.sec/3600),m=Math.floor(off.sec%3600/60);msg+=`<h3>🌙 離線收益</h3><p>離開 ${h} 小時 ${m} 分（上限 8 小時）</p><p>⚔️ 擊敗 ${fmt(off.kills)} 隻<br>📈 經驗 +${fmt(off.exp)}${off.lvup?`（升 ${off.lvup} 級）`:''}<br>💰 +${fmt(off.gold)}　💎 +${off.ore}　🧪 +${off.pot}</p>`;log(`🌙 離線收益：擊殺 ${off.kills}、EXP+${off.exp}`,'r4');window.__offline=off}

if(msg)modal(msg);else log('歡迎來到幻境大陸！冒險自動開始～');
save();render();panel();

 forceCrit(){if(!mob)return;const r=physHit(mob,1,{sure:1});r.crit=true;r.d=Math.floor((r.d||50)*1.4);playFx('slash',[r]);dealDmg(r.d)}};
