<!doctype html>
<html lang="zh-Hant" data-theme="ro"><head><meta charset="utf-8">
<script>(function(){var d=document.documentElement;try{var q=new URLSearchParams(location.search).get("theme"),t=q||localStorage.getItem("aur_theme")||"ro";d.setAttribute("data-theme",t==="xp"?"xp":"ro")}catch(e){d.setAttribute("data-theme","ro")}})()</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>曙光 Aurevia · 仙境冒險 · 割草大畫面 v3</title>
<link rel="stylesheet" href="xp.css"><link rel="stylesheet" href="horde.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="stage.css"><link rel="stylesheet" href="rotheme.css">
</head><body>
<div id="app">
 <div class="win" id="mainwin">
  <div class="tb"><span class="ic">◆</span><span class="ttl">曙光 Aurevia 仙境冒險 - 割草大畫面 v3（原型・全部是假資料）</span></div>
  <div class="bd">
   <div id="stage">
    <div class="win" id="w-scene">
     <div class="tb"><span class="ic">▣</span><span class="ttl" id="scene-title">戰鬥場景 - 霧沼濕地 08（割草）</span>
      <span class="wb"><button id="b-gear" title="控制面板" aria-label="控制面板">⚙</button><button id="b-big" title="放大 / 還原" aria-label="放大">⇱</button></span></div>
     <div class="bd">
      <div class="scene-tools">
       <label class="lbl">畫質 <select id="s-q" aria-label="畫質"><option value="auto">自動</option><option value="3">Q3 高</option><option value="2">Q2 中</option><option value="1">Q1 低</option><option value="0">Q0 省電</option></select></label>
       <button class="mini on" id="t-names">名牌</button><button class="mini on" id="t-dmg">傷害數字</button><button class="mini on" id="t-mini">小地圖</button>
       <span class="zoomg"><button class="mini" id="z-out" aria-label="縮小">−</button><span id="z-val">100%</span><button class="mini" id="z-in" aria-label="放大">＋</button></span>
       <span class="sp"></span>
       <button class="mini" id="t-theme" title="切換視窗外觀：舊版 RO ⇄ Windows XP">外觀：舊版 RO</button><button class="mini" id="t-gear" aria-label="控制面板">⚙ 控制</button><button class="mini" id="t-big">⛶ 放大</button><button class="mini" id="t-full">全螢幕</button>
      </div>
      <div class="scene-wrap" id="wrap">
       <canvas id="scene"></canvas>
       <div class="hud hud-tl" id="hud-tl"></div>
       <div class="hud hud-tr" id="hud-tr"></div>
       <div id="bossbar" class="hidden"><div class="bn" id="bossname"></div><div class="bb"><i id="bossfill"></i></div></div>
       <div id="banner" class="hidden"></div>
       <canvas id="mini" width="132" height="88"></canvas>
       <div class="win logwin" id="logwin">
        <div class="tb"><span class="ic">■</span><span class="ttl">戰鬥訊息 <small id="log-n"></small></span><span class="seg" role="group" aria-label="訊息模式"><button data-m="full">完整</button><button data-m="sum">摘要</button><button data-m="hl">重點</button></span><span class="wb"><button id="log-exp" title="展開 / 縮小" aria-label="展開訊息">⇱</button><button id="log-min" title="收合" aria-label="收合訊息">⊟</button></span></div>
        <div class="bd">
         <div class="logbox" id="logbox" tabindex="0"></div>
        </div>
       </div>
      </div>
     </div>
    </div>
    <div id="side">
     <div class="win" id="w-ctl">
      <div class="tb"><span class="ic">◆</span><span class="ttl">場景控制</span><span class="wb"><button id="b-closeside" aria-label="關閉">✕</button></span></div>
      <div class="bd pad">
       <div class="ctl"><div class="ctl-h"><label for="r-ch">角色數</label><b id="v-ch"></b></div><input type="range" id="r-ch" min="1" max="40" value="30"></div>
       <div class="ctl"><div class="ctl-h"><label for="r-mob">怪物數</label><b id="v-mob"></b></div><input type="range" id="r-mob" min="0" max="150" value="100"></div>
       <div class="ctl"><div class="ctl-h"><label for="r-gat">聚集度</label><b id="v-gat"></b></div><input type="range" id="r-gat" min="0" max="100" value="55"></div>
       <div class="ctl btns"><button class="go" id="b-boss">召喚 BOSS</button></div>
       <div class="ctl btns2"><button class="btn" id="b-pause">暫停</button><button class="btn" id="b-reset">重置</button><button class="btn" id="b-ring">邊界圈</button></div>
       <div class="ctl note" id="cap-note"></div>
       <div class="ctl note small">
        同屏上限：桌面 角色 40／怪 150；手機 角色 20／怪 60。畫質自動降階時，「實際」數字會比滑桿小。<br>
        圖像全為 Aurevia 原創素材（非官方），可用 assets/custom/ 換成自己的素材包（見 README）。傷害、經驗、掉寶都是亂數假資料。
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>
 </div>
</div>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="bgart.js"></script>
<script src="ui.js"></script>
<script src="horde.js"></script>
</body></html>
