<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><base href="/v2/"><link rel="icon" href="/icon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>仙境冒險 Aurevia · 割草</title>
<link rel="stylesheet" href="v2/v2.css">
</head><body>
<div id="app">
  <header id="top">
    <div class="brand">仙境冒險 · 割草</div>
    <div id="stageInfo"><span id="rgName">—</span><b id="stNo">1/10</b><span id="pips"></span><span id="tierTag" class="tag">普通</span></div>
    <div id="questWrap" title="關卡擊殺進度（無連殺）"><div id="questBar"><i id="questFill"></i><span id="questTxt">0 / 0</span></div></div>
    <div id="bossWrap" hidden><span id="bossName">王</span><div class="bar boss"><i id="bossFill"></i></div><span id="bossHp"></span></div>
    <div class="ctl">
      <select id="selRegion"></select><select id="selTier"></select><select id="selTeam"></select><select id="selVfx" title="技能特效顯示：自動＝5 人以下全部，6 人以上只看自己＋隊伍治療/挑釁與選定隊員；低畫質自動只看自己"></select><select id="selQ" title="畫質"><option value="auto">畫質：自動</option><option value="high">畫質：高</option><option value="low">畫質：低</option></select><span id="vfxNote" class="vnote"></span>
      <button id="btnSet" title="設定">⚙</button><button id="btnRestart" title="重新開始">↺</button>
    </div>
  </header>
  <aside id="left">
    <div class="ph"><b>隊伍輸出</b><nav id="dpsTabs"><button data-m="dmg" class="on">傷害</button><button data-m="heal">治療</button><button data-m="taken">承傷</button></nav></div>
    <div id="dpsList"></div>
    <div class="ph"><b>仇恨／目標</b></div>
    <div id="aggro"></div>
  </aside>
  <main id="stage"><canvas id="cv"></canvas><div id="banner" hidden></div><div id="overlay" hidden></div></main>
  <aside id="right">
    <div class="ph"><b id="eqTitle">裝備</b><span id="eqPower"></span></div>
    <div id="eqSlots"></div>
    <div id="eqDetail"></div>
  </aside>
  <footer id="bottom">
    <div id="party"></div>
    <div id="skills"></div>
  </footer>
  <nav id="mnav"><button data-p="char">👤<span>角色</span></button><button data-p="equip">🛡<span>裝備</span></button><button data-p="skill">✨<span>技能</span></button><button data-p="bag">🎒<span>背包</span></button><button data-p="party">👥<span>隊伍</span></button><button data-p="set">⚙<span>設定</span></button></nav>
  <div id="msheet" hidden><div class="mh"><b id="msTitle"></b><button id="msClose">✕</button></div><div id="msBody"></div></div>
  <div id="offline" hidden></div>
</div>
<script src="v2/tables.js"></script>
<script src="v2/engine.js"></script>
<script src="v2/v2.js"></script>
</body></html>
