function mvVec(){if(MV.joy)return MV.joy;let x=0,y=0;for(const k of MV.keys){const d=MVK[k];if(d){x+=d[0];y+=d[1]}}if(!x&&!y)return null;const l=Math.hypot(x,y);return[x/l,y/l]}
function mvWalk(x,y){const m=G.map;if(!m||x<0||y<0||x>=m.W||y>=m.H)return false;const v=m.tiles[(y|0)*m.W+(x|0)];return v===0||v===1||v===3||v===4}
function mvStep(dt,now){const me=G.me&&G.P[G.me.name];if(!me||!G.map)return;if(G.idleArena){MV.joy=null;MV.keys.clear()}const v=(KEYS_BLOCK()?null:mvVec());
 if(v&&!me.dead){if(!MV.on){MV.on=true;MV.x=me.x;MV.y=me.y;MV.cx=MV.cy=0}const sp=(G.d&&G.d.spd)||4.5;const st=sp*dt;const nx=MV.x+v[0]*st,ny=MV.y+v[1]*st;if(mvWalk(nx,ny)){MV.x=nx;MV.y=ny}else if(mvWalk(nx,MV.y))MV.x=nx;else if(mvWalk(MV.x,ny))MV.y=ny;MV.lastIn=now;
  if(now-MV.lastSend>50){MV.lastSend=now;MV.seq++;MV.hist.push([MV.seq,MV.x,MV.y]);if(MV.hist.length>60)MV.hist.shift();send({op:'mv',dx:v[0],dy:v[1],seq:MV.seq});MV.sent0=false}
  if(Math.abs(v[0])>.05)me.flip=v[0]<0?1:0}
 else if(!MV.sent0){MV.sent0=true;MV.seq++;MV.hist.push([MV.seq,MV.x,MV.y]);send({op:'mv',dx:0,dy:0,seq:MV.seq})}
 if(MV.on){// 平滑吃掉校正量
  const k=Math.min(1,dt*8);MV.x+=MV.cx*k;MV.y+=MV.cy*k;MV.cx-=MV.cx*k;MV.cy-=MV.cy*k;
  if(!v&&now-MV.lastIn>450){// 放開後交還伺服器（插值會從目前位置平滑接手）
   me.ex=MV.x-(me.ix??MV.x);me.ey=MV.y-(me.iy??MV.y);MV.on=false}else{me.x=MV.x;me.y=MV.y;me.moving=!!v}}}
function mvAck(m){if(!MV.on||!m.ack||!G.me)return;const sv=m.p.find(p=>p.id===G.me.name);if(!sv)return;let h=null;while(MV.hist.length&&MV.hist[0][0]<=m.ack)h=MV.hist.shift();if(!h)return;
 const ex=sv.x-h[1],ey=sv.y-h[2],e=Math.hypot(ex,ey);if(e>3){MV.x=sv.x;MV.y=sv.y;MV.cx=MV.cy=0;MV.hist.length=0}else if(e>.05){MV.cx=ex;MV.cy=ey}}
