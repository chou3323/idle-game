const mktDay=()=>Math.floor((Date.now()+8*3600e3)/864e5);// 台北日界
function mktRow(S,k){S.mkt=S.mkt||{day:mktDay(),g:{}};return S.mkt.g[k]=S.mkt.g[k]||{m:1,vol:[],ask:0,bid:0,today:0}}

function mktDaily(S){S.mkt=S.mkt||{day:mktDay(),g:{}};const d=mktDay();if(S.mkt.day===d)return;const n=Math.min(30,d-S.mkt.day);const R=RNG(d^(S.seed||7));
 for(const k in S.mkt.g){const r=S.mkt.g[k];for(let i=0;i<n;i++){// 單機：模擬其他玩家供需
   const dem=r.today+r.bid+R.n()*4,sup=r.ask+R.n()*4;const p=(dem-sup)/(dem+sup+1);r.m=Math.max(.5,Math.min(2.5,r.m*(1+.12*p)));r.vol.push(r.today+Math.floor(R.n()*3));if(r.vol.length>7)r.vol.shift();r.today=0}}

exTick=function(S){if(!S.ex)return[];const r=[];S.ex.mine=S.ex.mine.filter(l=>{const k=l.mat||eqKey(l.item),b=l.mat?band(S,k):eqBand(S,l.item),pos=(l.price-b.lo)/Math.max(1,b.hi-b.lo);// 越便宜越快賣

const _exListMat=exListMat;exListMat=function(S,m,qty,price,days){const e=_exListMat(S,m,qty,price);if(!e){const l=S.ex.mine[S.ex.mine.length-1];l.exp=expT(days)}return e};

 const s=await onApi('GET','/api/save');onSet('rev',s.rev);if(reg){await onUpload(true)}else if(confirm('要用雲端存檔覆蓋本機進度嗎？\n（取消＝保留本機，並上傳到雲端）')){onApplySave(s)}else await onUpload(true);onConnect();onDone(reg?'註冊成功，已建立雲端存檔':'登入成功')}catch(e){onDone(e.message)}}

 w.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='chat'){ON.chat.push(m);if(ON.chat.length>80)ON.chat.shift()}else if(m.t==='party'){ON.party=m.p}else if(m.t==='ev'){ON.evN+=m.ev.length;ON.pmobs=m.mobs}else if(m.t==='stage'){ON.stage=m.prog;log(`[組隊] ${m.win?'過關':'失敗'} → ${m.prog.ch+1}-${m.prog.st+1}`,'c')}else if(m.t==='saved'){onDownloadQuiet()}else if(m.t==='err')toast(m.e);else if(m.t==='topup'){toast('🎁 '+m.msg,3500);log(m.msg,'c');if(SFX.lv)SFX.lv()}

 h+=`<div class="card"><div class="row"><b>${esc(ON.name)}</b><span class="tag">${conn?'<span class="gr">● 已連線</span>':'<span class="rd">● 離線</span>'}</span><span class="sp"></span><button class="b s r" data-a="onOut">登出</button></div>
