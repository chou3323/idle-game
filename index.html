 const tabs=[['buff','增益技能'],['tog','常駐/被動'],['heal','治療補給'],['atk','攻擊技能'],['misc','拾取與範圍']];let body='';
 const learned=Object.keys(m.sk||{}).filter(k=>S[k]);
 if(tab==='buff'){const ks=Object.keys(ab.buff);body=ks.length?`<p class="note">到期前 3 秒自動重施；「戰前施放」會在尋找目標時先上增益。</p>`+ks.map(k=>`<div class="abr">${ic(k)}<b>${nm(k)}</b><label>${ck('buff.'+k+'.on',ab.buff[k].on)}啟用</label><label>${ck('buff.'+k+'.pre',ab.buff[k].pre)}戰前施放</label></div>`).join(''):'<p class="note">尚未學會增益技能。</p>'}
 if(tab==='tog'){const ks=learned.filter(k=>S[k].kind==='passive'||(S[k].buff&&C_LONG(k)));body='<p class="note">被動技能永遠生效；可切換的常駐增益會被自動維持開啟。</p>'+(ks.length?ks.map(k=>`<div class="abr">${ic(k)}<b>${nm(k)}</b>${S[k].kind==='passive'?'<small class="ok">被動・常時生效</small>':`<label>${ck('tog.'+k,ab.tog[k])}保持開啟</label>`}</div>`).join(''):'<p class="note">目前沒有被動或常駐技能。</p>')}
 if(tab==='heal'){const h=ab.heal;const hs=learned.filter(k=>S[k].heal);body=`<div class="abr"><b>治療技能</b><label>${ck('heal.on',h.on)}啟用</label>${hs.map(ic).join('')||'<small>（未學會）</small>'}</div>
  <div class="abr"><b>自身 HP 低於</b>${num('heal.self',h.self,0,95)}%</div><div class="abr"><b>隊友 HP 低於</b>${num('heal.party',h.party,0,95)}%</div>
  <div class="abr"><b>HP 藥水</b>低於${num('heal.potHp',h.potHp,0,95)}%<select data-p="heal.hpPot">${[['auto','自動（先橘後紅）'],['potR','紅色藥水'],['potO','橘色藥水']].map(([v,n])=>`<option value="${v}" ${h.hpPot===v?'selected':''}>${n}</option>`).join('')}</select></div>
  <div class="abr"><b>SP 藥水</b>低於${num('heal.potSp',h.potSp,0,95)}%<select data-p="heal.spPot">${[['potB','藍色藥水'],['none','不使用']].map(([v,n])=>`<option value="${v}" ${h.spPot===v?'selected':''}>${n}</option>`).join('')}</select></div>`}
 if(tab==='atk'){body=ab.atk.length?'<p class="note">依順序判斷，第一個符合條件的技能會被施放；否則普通攻擊。</p>'+ab.atk.map((a,i)=>`<div class="abr">${ic(a.k)}<b>${i+1}. ${nm(a.k)}</b><label>${ck('atk.'+i+'.on',a.on)}啟用</label><span>SP≥${num('atk.'+i+'.minSp',a.minSp,0,9999)}</span><span>怪數≥${num('atk.'+i+'.mobs',a.mobs,1,10)}</span><label>${ck('atk.'+i+'.boss',a.boss)}僅BOSS</label><button class="btn sm" data-up="${i}">▲</button><button class="btn sm" data-dn="${i}">▼</button></div>`).join(''):'<p class="note">尚未學會攻擊技能。</p>'}
 if(tab==='misc'){const pk=ab.pick;body=`<div class="abr"><b>狩獵模式</b><select data-p="mode">${[['near','附近最近的怪'],['quest','只打任務怪（完成後自動交付）'],['spot','定點狩獵']].map(([v,n])=>`<option value="${v}" ${ab.mode===v?'selected':''}>${n}</option>`).join('')}</select></div>
  <div class="abr"><b>索敵範圍</b>${num('range',ab.range,3,30)}格</div>
  <div class="abr"><b>定點</b><small>${ab.spot?`${esc(MAPN(ab.spot.map))} (${ab.spot.x|0},${ab.spot.y|0}) 半徑`:'未設定'}</small>${ab.spot?num('spot.r',ab.spot.r,2,20):''}<button class="btn sm" data-spot="1">設為目前位置</button></div>
  <div class="abr"><b>拾取</b><label>${ck('pick.use',pk.use)}消耗品</label><label>${ck('pick.etc',pk.etc)}素材</label><label>${ck('pick.eq',pk.eq)}裝備</label><label>${ck('pick.card',pk.card)}卡片</label></div><p class="note">未勾選的物品會自動換成金幣（半價）。離線掛機同樣套用。</p>`}
 return`<div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${n}</button>`).join('')}</div><div class="abw">${body}</div><div class="abf"><button class="btn" data-def="1">還原預設</button><button class="btn gold" data-save="1">儲存</button></div>`},
 bind(b,o){if(!o.ab)return;const ab=o.ab;b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{o.tab=x.dataset.t;UI.renderWin('autobs')});
  const setp=(p,v)=>{const ks=p.split('.');let t=ab;for(const k of ks.slice(0,-1))t=t[k];t[ks[ks.length-1]]=v};
  b.querySelectorAll('[data-p]').forEach(x=>x.onchange=()=>setp(x.dataset.p,x.type==='checkbox'?(x.checked?1:0):x.type==='number'?+x.value:x.value));
  b.querySelectorAll('[data-up],[data-dn]').forEach(x=>x.onclick=()=>{const i=+(x.dataset.up??x.dataset.dn),j=x.dataset.up!=null?i-1:i+1;if(j<0||j>=ab.atk.length)return;[ab.atk[i],ab.atk[j]]=[ab.atk[j],ab.atk[i]];UI.renderWin('autobs')});
  const sp=b.querySelector('[data-spot]');if(sp)sp.onclick=()=>{const p=G.P[G.me.name]||G.me;ab.spot={map:(G.map&&G.map.id)||G.me.map,x:Math.round(p.x),y:Math.round(p.y),r:(ab.spot&&ab.spot.r)||8};ab.mode='spot';UI.renderWin('autobs')};
  b.querySelector('[data-save]').onclick=()=>act({op:'abset',ab}).then(r=>{if(r&&r.ab)o.ab=r.ab;UI.renderWin('autobs')});
  b.querySelector('[data-def]').onclick=()=>{o.ab=null;o.ld=0;act({op:'abset',ab:{v:1,reset:1}}).then(()=>UI.renderWin('autobs'))}}};
function C_LONG(k){const b=G.D.skills[k]?.buff;return b&&G.D.buffs[b]&&G.D.buffs[b].dur>=120}

// ===== 啟動 =====
const MENU=[['stat','狀態','owl'],['skill','技能','staff'],['equip','裝備','armor'],['bag','背包','boots'],['quest','任務','card'],['market','市集','coin'],['exchange','鑽石匯兌','dia'],['more','更多','ring']];
const MORE=[['autobs','自動戰鬥'],['mail','信箱'],['settings','設定'],['mall','商城'],['premium','Premium'],['auction','拍賣'],['party','組隊'],['friends','好友'],['guild','公會'],['rank','排行'],['world','世界地圖'],['look','外觀'],['exch','兌換'],['mlog','交易紀錄'],['lore','職業']];
function buildMenus(){const btn=([k,n,ic])=>`<button class="tm" id="tb-${k}" data-w="${k}"><span class="ti">${ART.micon(k,30)}</span>${t(n)}</button>`;$('#topmenu').innerHTML=MENU.map(btn).join('');$('#mbar').innerHTML=MENU.filter(m=>['stat','skill','equip','bag','more'].includes(m[0])).map(btn).join('');$('#more').innerHTML=MORE.map(btn).join('');
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=e=>{e.stopPropagation();const w=b.dataset.w;if(w==='more'){$('#more').classList.toggle('on');return}$('#more').classList.remove('on');if(w==='lore')return UI.win('lore',{job:G.me.job==='nov'?'kni':G.me.job});if(w==='mlog')return UI.win('mlog',{});UI.win(w)})}
async function boot(){await loadLang(I18N.lang);$('#llang').innerHTML=Object.entries(I18N.langs).map(([k,v])=>`<option value="${k}" ${k===I18N.lang?'selected':''}>${v}</option>`).join('');$('#llang').onchange=async e=>{await loadLang(e.target.value);location.reload()};
 document.querySelectorAll('#login [placeholder]').forEach(e=>e.placeholder=t(e.placeholder));
 if('ontouchstart' in window||matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
 const go=async(n,p)=>{$('#lerr').textContent='連線中…';try{await connect(n,p);localStorage.robAuto=JSON.stringify([n,p]);$('#login').style.display='none';$('#hud').style.display='';start()}catch(e){$('#lerr').textContent=e}};
 $('#lgo').onclick=()=>go($('#lu').value.trim(),$('#lp').value);$('#lp').onkeydown=e=>{if(e.key==='Enter')$('#lgo').click()};
 $('#lguest').onclick=()=>{let g=JSON.parse(localStorage.robGuest||'null');if(!g){g=['旅人'+Math.random().toString(36).slice(2,7),Math.random().toString(36).slice(2,12)];localStorage.robGuest=JSON.stringify(g)}go(g[0],g[1])};
 const a=JSON.parse(localStorage.robAuto||'null');if(a){$('#lu').value=a[0];$('#lp').value=a[1];go(a[0],a[1])}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
let started=0;function start(){if(started)return;started=1;buildMenus();joystick();UI.applySet();
 $('#autob').onclick=()=>{if(UI._lp)return UI._lp=0;UI.toggleAuto()};{const ab=$('#autob');let tm;ab.oncontextmenu=e=>{e.preventDefault();UI.win('autobs')};ab.addEventListener('pointerdown',()=>{tm=setTimeout(()=>{UI._lp=1;UI.win('autobs')},550)});ab.addEventListener('pointerup',()=>clearTimeout(tm));ab.addEventListener('pointerleave',()=>clearTimeout(tm))}$('#atkb').onclick=e=>{e.stopPropagation();let best=null,bd=9;const me=G.P[G.me.name];for(const k in G.M){const m=G.M[k];const d=Math.hypot(m.x-me.x,m.y-me.y);if(d<bd){bd=d;best=m}}if(best){G.sel=best.id;send({op:'atk',mob:best.id})}else{if(!G.me.auto)UI.toggleAuto();toast(t('附近沒有怪物，自動前往狩獵區…'))}};
 $('#cmin').onclick=()=>{$('#ccard').classList.toggle('min');$('#cmin').textContent=$('#ccard').classList.contains('min')?'+':'–';$('#cname2').textContent=G.me.name};$('#chatbtn').onclick=()=>$('#chatin').focus();$('#fsbtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})};
 $('#mm').addEventListener('click',e=>{e.stopPropagation();const r=e.target.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*G.map.W),y=Math.floor((e.clientY-r.top)/r.height*G.map.H);G.dest=[x,y];send({op:'goto',map:G.map.id,x,y})});
 document.addEventListener('pointerdown',e=>{if(!e.target.closest('#more')&&!e.target.closest('[data-w="more"]'))$('#more').classList.remove('on')});
 const av=$('#avc').getContext('2d');setInterval(()=>{if(!G.me)return;av.clearRect(0,0,14,14);ART.hero(av,7,14,1,G.me.job,null,0,0,G.me.look)},1000);
 setTimeout(()=>{if(G.me&&G.me.blv<=1&&G.me.q.active.m1)UI.win('quest')},1500)}
boot();

</script></body></html>
