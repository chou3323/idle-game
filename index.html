 bind(b,o){const x=$('#lorec').getContext('2d');ART.hero(x,7,16,1,o.job,({kni:'sword',rgr:'bow',arc:'staff',acl:'mace',mer:'axe',thf:'sword',mnk:'knuckle',brd:'harp',lnc:'spear',msw:'sword2',hsn:'bow',smg:'axe'})[o.job],0,0);const d=$('#dojob');if(d)d.onclick=async()=>{const r=await act(o.k?{op:'qturn',k:o.k,job:o.job}:{op:'jobchange',job:o.job});if(!r.e)UI.close('lore')}}},
npc:{title:'NPC',w:440,manual:0,html(o){const n=o.npc,D=G.D,m=G.me;let h=`<div class="npch">${ART.icon('owl',40)}<div><b>${esc(n.n)}</b><p>${{shop:'歡迎光臨！冒險需要的藥水和裝備這裡都有。',refine:'把裝備交給我，敲打出更強的力量……失敗可別怪我。',job:'想成為更強的冒險者嗎？Job 等級到 10 就來找我轉職。',quest:'歡迎來到晨帆港！有需要幫忙的地方儘管說。',market:'交易所看板：所有交易都用鑽石進行。'}[n.act]||''}</p></div></div>`;
 const qa=(o.qa||[]).filter(k=>!m.q.done[k]&&!m.q.active[k]),qt=Object.keys(m.q.active).filter(k=>D.quests[k].giver===n.id);if(qa.length||qt.length)h+=`<div class="secth">任務</div>`+qa.map(k=>`<div class="npcq"><span class="qt ${D.quests[k].type}">!</span>${esc(D.quests[k].n)}<button class="btn b" data-acc="${k}">接受</button></div>`).join('')+qt.map(k=>{const p=G.qs[k]||[0,1];return`<div class="npcq"><span class="qt ${D.quests[k].type}">?</span>${esc(D.quests[k].n)} ${p[0]}/${p[1]}<button class="btn g" data-q="${k}">查看</button></div>`}).join('');
 if(n.act==='shop')h+=`<div class="secth">商品</div><div class="shopl">${o.shop.map(([i,p])=>{const d=D.items[i];return`<div class="shi">${ART.icon(d.icon,28)}<div><b>${esc(d.n)}</b><small>${d.type==='eq'?statLine(d).map(x=>x.join(' ')).join(' · ')+(d.lv>1?' · Lv'+d.lv:''):esc(d.desc||'')}</small></div><span>${ART.icon('coin',14)}${p}</span><input type="number" min="1" value="${d.type==='eq'?1:10}" data-n="${i}"><button class="btn b" data-buy="${i}">購買</button></div>`}).join('')}</div>`;
 if(n.act==='refine'){const R=D.refine;const all=[...Object.values(m.eq).filter(Boolean),...m.bag.filter(x=>D.items[x.id].type==='eq')];h+=`<div class="secth">選擇裝備</div><div class="grid sm">${all.map(it=>`<div class="cell ${o.pre===it.u?'sel':''}" data-pre="${it.u}">${ART.icon(D.items[it.id].icon,26)}${it.rf?`<i>+${it.rf}</i>`:''}</div>`).join('')}</div>`;const it=o.pre&&findIt(o.pre);if(it){const rf=it.rf||0;h+=`<div class="rfbox"><b style="color:${RARC(it)}">${esc(iname(it))}</b> → <b>+${rf+1}</b><div class="kv"><span>成功率 ${R.rate[rf]}%</span><span>費用 ${R.cost[rf]} 金幣</span><span>${rf>=R.safe?'需要 精煉礦石 ×1（擁有 '+m.bag.filter(x=>x.id==='ore').reduce((a,b)=>a+b.n,0)+'）':'安全精煉（不會失敗）'}</span><span class="${rf>=10?'red':''}">${rf<R.safe?'':rf>=10?'失敗：−1 或 30% 損毀':'失敗：等級 −1'}</span></div><button class="btn g wide" id="dorf">精煉</button></div>`}}
 if(n.act==='job'){const jh=m.jh||{};const row=j=>{const J=D.jobs[j];let can='',why='';if(m.job==='nov'){if(J.tier===1){can=m.jlv>=10;why=can?'可轉職':'需要 Job 10'}else why='需先完成一轉'}else if(J.tier===1){can=false;why=j===m.job?'目前職業':'僅限初心者轉職'}else{const rq=J.req||{jlv:20,blv:40};const CJ=D.jobs[m.job];if(j===m.job){can=false;why='目前職業'}else if(!CJ||CJ.tier!==1||!J.parents.includes(m.job)){can=false;why='需由 '+J.parents.map(p=>D.jobs[p].n).join('或')+' 轉入'}else{can=m.jlv>=rq.jlv&&m.blv>=rq.blv;why=can?'可轉職':'需要 Job '+m.jlv+'/'+rq.jlv+'、Base '+m.blv+'/'+rq.blv}}
  return`<div class="jrow ${can?'':'dim'}">${ART.icon(D.skills[J.skills[0]].icon,22)}<b>${J.n}</b><small>${J.weap.map(w=>D.weapons[w].n).join('・')}${J.shield?'・盾':''}</small><span>${why}</span><button class="btn ${can?'g':''}" data-lore="${j}" data-can="${can?1:''}">介紹</button></div>`};
  h+=`<div class="secth">一轉職業（9）</div>${Object.keys(D.jobs).filter(j=>D.jobs[j].tier===1).map(row).join('')}<div class="secth">混合職業（3）· 由所屬一轉職業 Job 20、Base 40 轉入</div>${Object.keys(D.jobs).filter(j=>D.jobs[j].tier===2).map(row).join('')}<p class="note">目前：${D.jobs[m.job].n} Job ${m.jlv}。一轉只能由初心者轉職；混合職業轉職後無法再轉。</p>`}
 if(n.act==='market')h+=`<button class="btn g wide" onclick="UI.win('market')">開啟市場</button><button class="btn b wide" onclick="UI.win('exchange')">開啟鑽石交易所</button>`;
 if(n.act==='quest')h+=`<button class="btn wide" onclick="UI.win('quest')">開啟任務日誌</button>`;return h},
 bind(b,o){b.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>act({op:'buy',i:x.dataset.buy,n:+b.querySelector(`[data-n="${x.dataset.buy}"]`).value}));b.querySelectorAll('[data-acc]').forEach(x=>x.onclick=async()=>{await act({op:'qaccept',k:x.dataset.acc});o.qa=o.qa.filter(k=>k!==x.dataset.acc);UI.renderWin('npc')});b.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>UI.win('quest',{tab:'prog'}));
  b.querySelectorAll('[data-pre]').forEach(x=>x.onclick=()=>{o.pre=+x.dataset.pre;UI.renderWin('npc')});const r=$('#dorf');if(r)r.onclick=async()=>{const res=await act({op:'refine',u:o.pre});SFX.play(res.refine?'refineOk':'refineFail')};b.querySelectorAll('[data-lore]').forEach(x=>x.onclick=()=>UI.win('lore',{job:x.dataset.lore,can:!!x.dataset.can}))}},
settings:{title:'設定',w:440,manual:1,html(){const sel=(k,opts)=>`<select data-set="${k}">${opts.map(([v,n])=>`<option value="${v}" ${String(SET[k])===String(v)?'selected':''}>${n}</option>`).join('')}</select>`;const ck=(k,n,ic)=>`<label class="srow"><span class="si">${ic}</span><input type="checkbox" data-set="${k}" ${SET[k]?'checked':''}> ${n}</label>`;const row=(ic,n,ctl)=>`<div class="srow"><span class="si">${ic}</span><span>${n}</span>${ctl}</div>`;

 <details class="keys"><summary>▸ 按鍵設定（鍵盤／手把）</summary>${Object.entries(KEYS).map(([k,v])=>`<div class="srow"><span>${{bag:'背包',equip:'裝備',skill:'技能',quest:'任務',stat:'屬性',market:'市場',exchange:'交易所',settings:'設定',auto:'自動狩獵'}[k]}</span><button class="btn" data-key="${k}">${v.toUpperCase()}</button></div>`).join('')}<small>1–9：快捷列　Enter：聊天　Esc：關閉視窗　方向鍵：移動　手把：左搖桿移動（下一版）</small></details>

 <div class="secb">📶 ${t('連線狀態')}</div><div class="connrow"><button class="btn b" id="relog">⏏ ${t('返回登入頁面')}</button><div id="connst"></div></div>`},

 const fee=r?r.fee:{list:1,pct:5,min:1};let main='';

 else if(o.tab==='sell'){const sell=G.me.bag.filter(it=>D.items[it.id].type!=='use'||1);const it=o.u&&findIt(o.u);const st=o.st;const pr=o.price||st&&(st.ask||st.ref)||1;const n=Math.min(o.n||1,it?it.n:1);const val=pr*n,fe=Math.max(fee.min,Math.ceil(val*fee.pct/100));
